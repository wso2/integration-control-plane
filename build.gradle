plugins {
    id 'java'
}

import java.util.logging.Logger

def logger = Logger.getLogger('ICPBuild')

group = 'wso2'
// Read version from gradle.properties
version = project.property('project.version') 

repositories {
    mavenCentral()
    maven {
        url 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
    }
}

// Configuration for cipher tool JARs and their dependencies
configurations {
    cipherTool
}

dependencies {
    cipherTool("org.wso2.ciphertool:org.wso2.ciphertool:${cipherToolVersion}") {
        transitive = true
    }
}

// Project description
description = 'WSO2 Integration Control Plane - Build Configuration'

// Define subproject or module tasks
task cleanICP {
    description = 'Clean build artifacts'
    doLast {
        logger.info('Cleaning Integration Control Plane...')
        exec {
            commandLine 'rm', '-rf', 'icp_server/target'
        }
        logger.info('Clean complete')
    }
}

task buildICP {
    description = 'Build the Integration Control Plane project'
    dependsOn cleanICP
    doLast {
        logger.info('Building Integration Control Plane...')
        exec {
            workingDir 'icp_server'
            commandLine 'bal', 'build'
        }
        logger.info('Build complete')
    }
}

// Override default build task
build.dependsOn buildICP

task run {
    description = 'Run the ICP Server locally'
    dependsOn buildICP
    doLast {
        logger.info('Starting ICP Server...')
        exec {
            workingDir 'icp_server'
            commandLine 'bal', 'run'
        }
    }
}

task testICP {
    description = 'Run ICP Ballerina unit tests (self-contained H2) with code coverage (skip coverage with -PnoCoverage)'
    // Seed the H2 test databases first so the suite needs no external MySQL.
    dependsOn ':icp_server:initTestH2'
    // When both run, build the jar first: buildICP cleans target, so it must precede the dump.
    mustRunAfter buildICP
    doLast {
        logger.info('Running tests...')
        exec {
            workingDir 'icp_server'
            // -PnoCoverage speeds up local iterations; the combined coverage report then self-skips.
            commandLine(['bal', 'test'] + (project.hasProperty('noCoverage') ? [] : ['--code-coverage']))
        }
        logger.info('Tests complete')
    }
}

task buildFrontend {
    description = 'Build the frontend application'

    inputs.dir('frontend/src')
    inputs.file('frontend/package.json')
    outputs.dir('frontend/dist')
    // The work happens in doLast through exec, outside gradle's dependency tracking — an
    // up-to-date miss here ships a STALE frontend inside the distribution zip, which is the
    // kind of failure nobody notices until a fixed bug reappears. Always rebuild; vite is fast.
    outputs.upToDateWhen { false }

    doLast {
        logger.info('Building frontend...')
        exec {
            workingDir 'frontend'
            commandLine 'pnpm', 'install'
        }
        exec {
            workingDir 'frontend'
            commandLine 'pnpm', 'build'
        }
        logger.info('Frontend build complete')
    }
}

task copyFrontendDist {
    description = 'Copy frontend dist folder contents to www folder'
    dependsOn buildFrontend
    doLast {
        logger.info('Copying frontend dist to www folder...')
        
        def distDir = file('frontend/dist')
        def wwwDir = file('www')
        
        if (distDir.exists()) {
            // Clean www directory contents but preserve .gitkeep
            if (wwwDir.exists()) {
                delete fileTree(wwwDir) {
                    exclude '.gitkeep'
                }
            } else {
                wwwDir.mkdirs()
            }
            
            // Copy all contents from dist to www
            copy {
                from distDir
                into wwwDir
            }
            logger.info('Frontend dist copied to www folder')
        } else {
            throw new GradleException("Frontend dist not found at ${distDir.absolutePath} - ensure buildFrontend completed")
        }
    }
}

task packageICP {
    description = 'Package the ICP executable JAR into a zip file'
    dependsOn buildICP, copyFrontendDist
    doLast {
        logger.info('Packaging Integration Control Plane...')
        
        def jarFile = file('icp_server/target/bin/icp_server.jar')
        def zipDir = file('build/distribution')
        def zipFile = file("build/distribution/wso2-integration-control-plane-${version}.zip")
        
        if (!zipDir.exists()) {
            zipDir.mkdirs()
        }
        
        if (jarFile.exists()) {
            // Create a temporary directory for packaging
            def tempDir = file('build/temp-package')
            def rootDir = file("${tempDir}/wso2-integration-control-plane-${version}")
            if (tempDir.exists()) {
                delete tempDir
            }
            tempDir.mkdirs()
            rootDir.mkdirs()
            
            // Copy JAR to bin directory
            def binDir = file("${rootDir}/bin")
            if (!binDir.exists()) {
                binDir.mkdirs()
            }
            copy {
                from jarFile
                into binDir
                rename { 'icp-server.jar' }
            }

            // Add version.txt to distribution root directory (PARENT_DIR)
            def versionFile = file("${rootDir}/version.txt")
            versionFile.text = "${version}\n"
            
            // Copy README and LICENSE if they exist
            if (file('README.md').exists()) {
                copy {
                    from 'README.md'
                    into rootDir
                }
            }
            
            if (file('LICENSE').exists()) {
                copy {
                    from 'LICENSE'
                    into rootDir
                }
            }
            
            // Copy Config.toml if it exists
            if (file('icp_server/Config.toml').exists()) {
                def confDir = file("${rootDir}/conf")
                if (!confDir.exists()) {
                    confDir.mkdirs()
                }
                copy {
                    from 'icp_server/Config.toml'
                    into confDir
                    rename { 'deployment.toml' }
                }
            }
            
            // Copy conf/security folder if it exists (from root conf folder)
            if (file('conf/security').exists()) {
                def securityDir = file("${rootDir}/conf/security")
                if (!securityDir.exists()) {
                    securityDir.mkdirs()
                }
                copy {
                    from 'conf/security'
                    into securityDir
                }
            }
            
            
            // Copy database files if they exist
            if (file('icp_server/database/icp_db.mv.db').exists()) {
                def dbDir = file("${rootDir}/bin/database")
                if (!dbDir.exists()) {
                    dbDir.mkdirs()
                }
                copy {
                    from 'icp_server/database/icp_db.mv.db'
                    into dbDir
                }
            }

            if (file('icp_server/database/credentials_db.mv.db').exists()) {
                def dbDir = file("${rootDir}/bin/database")
                if (!dbDir.exists()) {
                    dbDir.mkdirs()
                }
                copy {
                    from 'icp_server/database/credentials_db.mv.db'
                    into dbDir
                }
            }
            
            // Copy scripts from distribution/scripts folder to bin directory only
            def scriptsDir = file('distribution/scripts')
            if (scriptsDir.exists()) {
                // Copy only to bin directory
                def tempBinDir = file("${rootDir}/bin")
                if (!tempBinDir.exists()) {
                    tempBinDir.mkdirs()
                }

                copy {
                    from scriptsDir
                    into tempBinDir
                }

                // Normalize line endings to LF and make shell scripts executable
                fileTree(tempBinDir) { include '*.sh' }.each { f ->
                    new ProcessBuilder('chmod', '+x', f.absolutePath).start().waitFor()
                }
            } else {
                logger.warning("Scripts directory not found at ${scriptsDir.absolutePath}")
                logger.warning("Please ensure distribution/scripts folder exists with run.sh and run.bat")
            }

            // Create lib/ directory for additional server-side JARs
            def serverLibDir = file("${rootDir}/lib")
            if (!serverLibDir.exists()) {
                serverLibDir.mkdirs()
            }
            logger.info("Created lib/ directory")

            // Copy cipher tool JARs to ciphertool-libs/ directory
            def libDir = file("${rootDir}/ciphertool-libs")
            if (!libDir.exists()) {
                libDir.mkdirs()
            }
            copy {
                from configurations.cipherTool
                into libDir
            }
            logger.info("Added cipher tool JARs to ciphertool-libs/")

            // Copy cipher tool config files from distribution/src/main/resources/conf/
            def cipherStandaloneConfig = file('distribution/src/main/resources/conf/cipher-standalone-config.properties')
            if (cipherStandaloneConfig.exists()) {
                def distConfDir = file("${rootDir}/conf")
                if (!distConfDir.exists()) {
                    distConfDir.mkdirs()
                }
                copy {
                    from cipherStandaloneConfig
                    into distConfDir
                }
                logger.info("Added cipher-standalone-config.properties to conf/")
            }

            // Copy cipher tool security config files from distribution/src/main/resources/conf/security/
            def cipherSecuritySrcDir = file('distribution/src/main/resources/conf/security')
            if (cipherSecuritySrcDir.exists()) {
                def distSecurityDir = file("${rootDir}/conf/security")
                if (!distSecurityDir.exists()) {
                    distSecurityDir.mkdirs()
                }
                copy {
                    from cipherSecuritySrcDir
                    include 'cipher-tool.properties'
                    include 'cipher-text.properties'
                    into distSecurityDir
                }
                logger.info("Added cipher tool security config files to conf/security/")
            }
            
            // Copy www folder if it exists
            if (file('www').exists()) {
                def wwwDir = file("${rootDir}/www")
                if (!wwwDir.exists()) {
                    wwwDir.mkdirs()
                }
                copy {
                    from 'www'
                    into wwwDir
                }
                logger.info("Added www folder to package")
            }
            
            // Copy database init scripts if they exist
            def dbInitScriptsDir = file('icp_server/resources/db/init-scripts')
            if (dbInitScriptsDir.exists()) {
                def dbScriptsDir = file("${rootDir}/dbscripts")
                if (!dbScriptsDir.exists()) {
                    dbScriptsDir.mkdirs()
                }
                copy {
                    from dbInitScriptsDir
                    into dbScriptsDir
                }
                logger.info("Added database init scripts to package")
            }
            
            // Create the zip file
            logger.info("Creating zip file: ${zipFile.absolutePath}")
            // `zip -r` UPDATES an existing archive, so every build's hashed bundles pile up in
            // the distribution forever — and a consumer can end up serving whichever index.html
            // survived. The archive is rebuilt from scratch, never appended.
            delete zipFile
            exec {
                workingDir 'build/temp-package'
                commandLine 'zip', '-r', zipFile.absolutePath, '.'
            }
            
            // Clean up temp directory
            delete tempDir
            
            logger.info("Package created: ${zipFile.absolutePath}")
            logger.info("Archive contents:")
            exec {
                commandLine 'unzip', '-l', zipFile.absolutePath
            }
        } else {
            logger.severe("ERROR: JAR file not found at ${jarFile.absolutePath}")
            logger.severe("Please run 'gradle buildICP' first")
        }
    }
}

// Make build task depend on packageICP (which depends on buildICP)
build.dependsOn packageICP

// Build lifecycle tasks
task assembleICP {
    description = 'Build and package the project'
    dependsOn buildICP, packageICP
}

task checkICP {
    description = 'Run checks and tests'
    dependsOn testICP
}

task coverage {
    group = 'verification'
    description = 'Run unit tests + E2E and build the combined coverage report (skip E2E with -PskipE2E)'
    // buildICP gives combinedCoverageReport a jar matching the dumps; testICP runs after it.
    dependsOn buildICP, testICP
    // The combined report needs both dumps, so it (and E2E) only run when E2E is not skipped.
    if (!project.hasProperty('skipE2E')) {
        dependsOn ':e2e-tests:test', ':e2e-tests:combinedCoverageReport'
    }
}

check.dependsOn checkICP
check.dependsOn ':e2e-tests:test'
// A normal `gradle build` runs unit tests plus all E2E suites, so also emit the combined report.
// It self-skips when any required dump is missing (e.g. `build -x :e2e-tests:test`).
check.dependsOn ':e2e-tests:combinedCoverageReport'

// Help task
task helpICP {
    description = 'Show build tasks'
    doLast {
        def helpMessage = """
        WSO2 Integration Control Plane - Gradle Build Tasks
        ====================================================
        
        Available tasks:
        
        Build Tasks:
        - gradle buildICP        : Build the project (Ballerina compilation)
        - gradle cleanICP        : Clean build artifacts
        - gradle assembleICP     : Build and package the project (creates ZIP)
        - gradle packageICP      : Package the JAR into a distributable ZIP file
        
        Execution Tasks:
        - gradle run             : Run the ICP Server locally
        - gradle testICP         : Run unit tests
        
        Other Tasks:
        - gradle checkICP        : Run checks and tests
        - gradle helpICP         : Show this help message
        
        Prerequisites:
        - Ballerina SDK installed for local builds
        - Docker and Docker Compose for container builds
        
        Example workflow:
        1. gradle buildICP       # Build the project
        2. gradle testICP        # Run tests
        3. gradle run            # Run the server
        
        For Docker-based workflow:
        1. gradle buildDocker    # Build and run with Docker
        """
        logger.info(helpMessage)
    }
}

// Default task
defaultTasks 'helpICP'

// Wrapper configuration
wrapper {
    gradleVersion = '8.5'
}
