name: Release ICP Distribution

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v2.0.0, v2.0.1, etc.
      - "v*.*.*-alpha*" # Triggers on alpha tags like v2.0.0-alpha, v2.0.0-alpha.1
      - "v*.*.*-beta*" # Triggers on beta tags like v2.0.0-beta, v2.0.0-beta.1
      - "v*.*.*-rc*" # Triggers on release candidate tags like v2.0.0-rc.1
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build only, no release)"
        required: false
        type: boolean
        default: false
      product_integrator_branch:
        description: "Product Integrator branch to update"
        required: false
        type: string
      next_version:
        description: "Next development version for the post-release bump PR (default: next patch, e.g. 2.1.1-SNAPSHOT)"
        required: false
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release ICP Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          # Validate version format (SemVer 2.0.0 compliant)
          # Official regex from semver.org
          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'

          if ! [[ "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "ERROR: Invalid version format: $VERSION"
            echo "Expected format: MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease or MAJOR.MINOR.PATCH-prerelease+build"
            echo "Examples: 2.0.0, 2.0.0-alpha, 2.0.0-beta.1, 2.0.0-rc.2, 2.0.0-alpha.beta+build.123"
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

          # Auto-detect if this is a pre-release based on version string
          # Any version with a hyphen (prerelease suffix) is considered a pre-release per semver
          if [[ "$VERSION" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Detected pre-release version"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Detected stable release version"
          fi

      - name: Refuse an existing release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.version.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setFailed(`Release ${tag} already exists; refusing to modify it.`);

      # A pushed tag already points at a commit we can't change, so the source it tags must
      # already carry the release version. (A manual run commits the version itself; see
      # "Commit release version" below.)
      - name: Check tagged source version
        if: ${{ github.event_name == 'push' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT=$(grep '^project\.version=' gradle.properties | cut -d= -f2)
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "ERROR: tag v${VERSION} points at a commit whose gradle.properties has project.version=${CURRENT}."
            echo "Delete the tag and run this workflow manually with version=${VERSION}; it commits the version and tags that commit."
            exit 1
          fi

      - name: Update version in gradle.properties
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Escape special characters for sed (/, &, \)
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/[\/&]/\\&/g')

          # Update gradle.properties (build.gradle reads from here)
          sed -i "s/^project\\.version=.*/project.version=${ESCAPED_VERSION}/" gradle.properties

          # Verify changes
          echo "=== gradle.properties ==="
          grep project.version gradle.properties
          echo "Version will be: ${VERSION}"

      - name: Update version in config files
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Escape special characters for sed (/, &, \)
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/[\/&]/\\&/g')

          # Update icpVersion default in icp_server/config.bal
          sed -i "s/^configurable string icpVersion = \".*\";/configurable string icpVersion = \"${ESCAPED_VERSION}\";/" icp_server/config.bal

          # Update VITE_ICP_VERSION in frontend source config
          jq --arg v "$VERSION" '.VITE_ICP_VERSION = $v' frontend/public/config.json > /tmp/config.json && mv /tmp/config.json frontend/public/config.json

          # Update the Ballerina package version so the module version baked into icp-server.jar matches the release
          sed -i "0,/^version = \".*\"/s//version = \"${ESCAPED_VERSION}\"/" icp_server/Ballerina.toml
          sed -i "/^name = \"icp_server\"$/{n;s/^version = \".*\"/version = \"${ESCAPED_VERSION}\"/}" icp_server/Dependencies.toml

          # Verify changes
          echo "=== icp_server/config.bal ==="
          grep icpVersion icp_server/config.bal
          echo "=== frontend/public/config.json ==="
          jq .VITE_ICP_VERSION frontend/public/config.json
          echo "=== icp_server/Ballerina.toml ==="
          sed -n '1,5p' icp_server/Ballerina.toml
          echo "=== icp_server/Dependencies.toml ==="
          grep -A1 '^name = "icp_server"$' icp_server/Dependencies.toml

      # Commit the version edits so the tag created below points at source that says the released
      # version. The commit is only reachable through the tag; the branch itself is not pushed, so
      # this works on protected branches. The build runs from this commit's tree.
      - name: Commit release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: release_commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties icp_server/config.bal frontend/public/config.json icp_server/Ballerina.toml icp_server/Dependencies.toml
          if git diff --cached --quiet; then
            echo "Source already at ${VERSION}; tagging the checked-out commit as is."
          else
            git commit -m "Release v${VERSION}"
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "ERROR: unexpected uncommitted changes; the built tree would not match the tagged commit."
            git status --short
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only packages the distribution (frontend + backend build), skipping the unit/E2E test
      # suite — those already gate every PR into main via pr-check.yml, so re-running them here
      # only adds release-pipeline fragility (flaky Testcontainers/Docker startup on the runner)
      # without adding safety.
      - name: Build distribution package
        run: ./gradlew clean packageICP
        env:
          CI: true

      - name: Verify distribution package
        run: |
          DIST_FILE="build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip"
          if [ -f "$DIST_FILE" ]; then
            echo "✓ Distribution package found: $DIST_FILE"
            ls -lh "$DIST_FILE"
            unzip -l "$DIST_FILE" | head -20
          else
            echo "✗ Distribution package not found: $DIST_FILE"
            echo "Available files in build/distribution:"
            ls -la build/distribution/ || echo "Directory does not exist"
            exit 1
          fi

      - name: Extract distribution for scanning
        run: |
          DIST_FILE="build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip"
          EXTRACT_DIR="build/distribution/extracted"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$DIST_FILE" -d "$EXTRACT_DIR"
          echo "Extracted to: $EXTRACT_DIR"
          ls -la "$EXTRACT_DIR"

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "build/distribution/extracted"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: "trivy-results.sarif"

      - name: Trivy security gate (block on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          scan-ref: "build/distribution/extracted"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # if: always() so a report is still generated when the gate above fails on findings —
      # skip-setup-trivy is intentionally omitted (defaults to false) so this step installs its
      # own trivy binary instead of assuming an earlier step already did: relying on that
      # assumption breaks whenever an earlier step in the job is skipped or fails first.
      - name: Generate Trivy report (table format)
        uses: aquasecurity/trivy-action@0.35.0
        if: always()
        with:
          scan-type: "fs"
          scan-ref: "build/distribution/extracted"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results-${{ steps.version.outputs.version }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Clean up extracted files
        if: always()
        run: rm -rf build/distribution/extracted

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## WSO2 Integration Control Plane v${{ steps.version.outputs.version }}

          ### What's New

          This release includes the following components:
          - **Backend (ICP Server)**: Ballerina-based GraphQL API service
          - **Frontend**: React + TypeScript application
          - **Database Support**: MySQL, PostgreSQL, MSSQL, H2

          ### Download & Installation

          1. Download the `wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip` file below
          2. Extract the archive: `unzip wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip`
          3. Navigate to the bin directory: `cd wso2-integration-control-plane-${{ steps.version.outputs.version }}/bin`
          4. Run the server:
             - Linux/macOS: `./icp.sh`
             - Windows: `icp.bat`

          ### System Requirements

          - Java 17 or higher
          - Supported databases: MySQL 8.0+, PostgreSQL 12+, MSSQL 2019+, or H2 (embedded)
          - Minimum 2GB RAM
          - 1GB disk space

          ### Documentation

          For detailed documentation, please refer to the [README.md](https://github.com/wso2/integration-control-plane/blob/main/README.md)

          ### Quick Start

          ```bash
          # Default credentials
          Username: admin
          Password: admin

          # Access the application
          Frontend: https://localhost:9446
          GraphQL API: https://localhost:9446/graphql
          ```
          EOF

          echo "Release notes generated successfully"

      - name: Calculate checksums
        run: |
          cd build/distribution
          sha256sum wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip > wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.sha256
          md5sum wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip > wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.md5
          echo "Checksums:"
          cat wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.sha256
          cat wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.md5

      - name: Dry Run Summary
        if: inputs.dry_run
        run: |
          echo "## 🔍 Dry Run - No Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This was a dry run. The following would have been released:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release**: ${{ inputs.prerelease || steps.version.outputs.is_prerelease == 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Ready" >> $GITHUB_STEP_SUMMARY
          echo "✓ Distribution ZIP ($(du -h build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip | cut -f1))" >> $GITHUB_STEP_SUMMARY
          echo "✓ SHA256 checksum" >> $GITHUB_STEP_SUMMARY
          echo "✓ MD5 checksum" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To create the actual release, run without dry_run option.**" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts for dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: icp-distribution-${{ steps.version.outputs.version }}
          path: |
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.sha256
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.md5
          retention-days: 30

      - name: Push release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "ERROR: tag ${TAG} already exists on origin; refusing to move it."
            exit 1
          fi
          git tag -a "${TAG}" -m "WSO2 Integration Control Plane ${TAG}" "${{ steps.release_commit.outputs.sha }}"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WSO2 Integration Control Plane v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.sha256
            build/distribution/wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip.md5
          draft: false
          prerelease: ${{ inputs.prerelease || steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After a stable release, open a PR that moves the branch the release was cut from to the
      # next development version, so gradle.properties never lags behind a released version.
      - name: Compute next development version
        if: ${{ !inputs.dry_run && !inputs.prerelease && steps.version.outputs.is_prerelease == 'false' }}
        id: next_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NEXT="${{ inputs.next_version }}"
          if [ -z "$NEXT" ]; then
            CORE="${VERSION%%+*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          fi

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BASE="${{ github.ref_name }}"
          else
            BASE="${{ github.event.repository.default_branch }}"
          fi

          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Next development version: ${NEXT} (base branch: ${BASE})"

      - name: Checkout base branch for version bump
        if: ${{ steps.next_version.outputs.next != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.next_version.outputs.base }}
          path: version-bump
          persist-credentials: false

      - name: Bump to next development version
        if: ${{ steps.next_version.outputs.next != '' }}
        id: bump
        working-directory: version-bump
        run: |
          NEXT="${{ steps.next_version.outputs.next }}"
          ESCAPED_NEXT=$(echo "$NEXT" | sed 's/[\/&]/\\&/g')
          CURRENT=$(grep '^project\.version=' gradle.properties | cut -d= -f2)
          echo "Current version on ${{ steps.next_version.outputs.base }}: ${CURRENT}"

          # Never move a branch backwards, e.g. a 2.1.1 patch release when main is already on 2.2.0-SNAPSHOT
          HIGHEST=$(printf '%s\n%s\n' "${CURRENT%-SNAPSHOT}" "${NEXT%-SNAPSHOT}" | sort -V | tail -n1)
          if [ "${CURRENT}" == "${NEXT}" ] || [ "${HIGHEST}" != "${NEXT%-SNAPSHOT}" ]; then
            echo "Branch is already at ${CURRENT}; skipping version bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s/^project\\.version=.*/project.version=${ESCAPED_NEXT}/" gradle.properties
          sed -i "s/^configurable string icpVersion = \".*\";/configurable string icpVersion = \"${ESCAPED_NEXT}\";/" icp_server/config.bal
          jq --arg v "$NEXT" '.VITE_ICP_VERSION = $v' frontend/public/config.json > /tmp/config.json && mv /tmp/config.json frontend/public/config.json
          sed -i "0,/^version = \".*\"/s//version = \"${ESCAPED_NEXT}\"/" icp_server/Ballerina.toml
          sed -i "/^name = \"icp_server\"$/{n;s/^version = \".*\"/version = \"${ESCAPED_NEXT}\"/}" icp_server/Dependencies.toml

          git diff --stat
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create version bump pull request
        if: ${{ steps.bump.outputs.skip == 'false' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: version-bump
          base: ${{ steps.next_version.outputs.base }}
          branch: bump-version-${{ steps.next_version.outputs.next }}
          commit-message: Bump version to ${{ steps.next_version.outputs.next }}
          title: Bump version to ${{ steps.next_version.outputs.next }}
          body: |
            ## Purpose
            Move the source tree to the next development version after releasing v${{ steps.version.outputs.version }}.

            Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}

      - name: Check Product Integrator token
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && inputs.product_integrator_branch != '' }}
        id: product_integrator_token
        env:
          TOKEN: ${{ secrets.PRODUCT_INTEGRATOR_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set PRODUCT_INTEGRATOR_TOKEN to enable Product Integrator version syncs."
          fi

      - name: Checkout Product Integrator
        if: ${{ steps.product_integrator_token.outputs.available == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: wso2/product-integrator
          ref: ${{ inputs.product_integrator_branch }}
          token: ${{ secrets.PRODUCT_INTEGRATOR_TOKEN }}
          path: product-integrator
          persist-credentials: false

      - name: Update Product Integrator ICP version
        if: ${{ steps.product_integrator_token.outputs.available == 'true' }}
        working-directory: product-integrator
        run: |
          sed -i "s/^icp\.version=.*/icp.version=${{ steps.version.outputs.version }}/" ci/build/component-versions.properties
          grep '^icp.version=' ci/build/component-versions.properties

      - name: Create Product Integrator pull request
        if: ${{ steps.product_integrator_token.outputs.available == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PRODUCT_INTEGRATOR_TOKEN }}
          path: product-integrator
          base: ${{ inputs.product_integrator_branch }}
          branch: update-icp-${{ steps.version.outputs.version }}
          commit-message: Update ICP version to ${{ steps.version.outputs.version }}
          title: Update ICP version to ${{ steps.version.outputs.version }}
          body: |
            ## Purpose
            Update Product Integrator to use ICP ${{ steps.version.outputs.version }}.

            Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}

      - name: Release summary
        if: ${{ !inputs.dry_run }}
        run: |
          echo "## ✅ Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Distribution Package**: wso2-integration-control-plane-${{ steps.version.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Published" >> $GITHUB_STEP_SUMMARY
          echo "✓ Distribution ZIP" >> $GITHUB_STEP_SUMMARY
          echo "✓ SHA256 checksum" >> $GITHUB_STEP_SUMMARY
          echo "✓ MD5 checksum" >> $GITHUB_STEP_SUMMARY
