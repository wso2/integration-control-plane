name: Unit Tests PR Check

# Runs the Vitest unit test suite on every PR that touches the ipaas frontend.
# Fast (~2s), requires no secrets or external services — suitable as a required
# status check.
#
# To make it required: add "Unit Tests PR Check / Vitest unit tests" to
# your branch protection rules under Settings → Branches → Required status checks.

on:
  pull_request:
    branches:
      - main
      - devant-migration
    paths:
      - 'ipaas/**'

jobs:
  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ipaas/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ipaas
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ipaas
        run: pnpm test:unit
