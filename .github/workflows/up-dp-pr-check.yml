# Checks UP-DP on every PR that can change it: the whole Go module under
# user-portal (the BFF, the iPaaS mock and shared/), as `make test` and
# `make lint` do, and the SPA under user-portal/up-dp/web.
# Needs no secrets or external services.
name: UP-DP PR Check

on:
  pull_request:
    paths:
      - 'user-portal/up-dp/**'
      - 'user-portal/ipaas-mock/**'
      - 'user-portal/shared/**'
      - 'user-portal/Makefile'
      - 'user-portal/go.mod'
      - 'user-portal/go.sum'
      - 'user-portal/.golangci.yaml'
      - '.github/workflows/up-dp-pr-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff:
    name: Go tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: user-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: user-portal/go.mod
          cache-dependency-path: user-portal/go.sum

      - name: Vet
        run: go vet ./...

      # The same packages the release workflow's `make test` runs.
      - name: Run tests
        run: make test

      - name: Build
        run: make build

      # The same version and rules as `make lint`.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: user-portal
          args: ./... --timeout=5m

  spa:
    name: SPA type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: user-portal/up-dp/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: user-portal/up-dp/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user-portal/up-dp/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc -b` first, so a type error or a misspelt string key fails the check.
      - name: Build
        run: pnpm build
