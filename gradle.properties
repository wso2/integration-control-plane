# Gradle Build Properties
# WSO2 Integration Control Plane

# Gradle version
org.gradle.gradle.version=9.8.0

# JVM settings
org.gradle.jvmargs=-Xmx2048m

# Parallel builds
org.gradle.parallel=true

# Build cache
org.gradle.caching=true

# Daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000

# Project configuration
project.name=integration-control-plane
project.version=2.0.0-SNAPSHOT
project.group=wso2

# Ballerina configuration
ballerina.build.skipTests=false
ballerina.build.outputDirectory=target

# Docker configuration
docker.registry=wso2
docker.imageTag=latest

# Cipher Tool configuration
cipherToolVersion=1.2.9

# Build output
org.gradle.console=plain
org.gradle.logging.level=info

# Credentials of the bundled H2 quick-start databases (also in icp_server/Config.toml and
# H2_QUICKSTART_* in icp_server/modules/storage/connection_manager.bal)
h2QuickStartUser=icp_user
h2QuickStartPassword=icp_password
