# ICP Server Configuration File
# This file contains all configurable parameters for the Integration Control Plane server

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
# HTTP server settings
# serverPort = 9446
# serverHost = "0.0.0.0"

# =============================================================================
# OPERATIONAL CONFIGURATION
# =============================================================================
# Runtime management settings
schedulerIntervalSeconds = 60  # 1 minute

# Refresh token cleanup settings
# refreshTokenCleanupIntervalSeconds = 86400  # 24 hours - clean up expired/revoked tokens

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
# Logging and monitoring settings
logLevel = "INFO"  # Options: DEBUG, INFO, WARN, ERROR
enableAuditLogging = true
# auditLogFilePath = "../logs/audit.log"  # Dedicated audit log file (JSONL format); set to "" to disable file output
enableMetrics = true

# =============================================================================
# OPENSEARCH CONFIGURATION
# =============================================================================
# NOTE: These keys must remain in the top-level section (before any [section]
# header). Placing them under a [section] header will cause startup errors.
# Providing opensearchUrl implicitly enables OpenSearch observability.
# opensearchUrl = "https://localhost:9200"
# opensearchUsername = "admin"
# opensearchPassword = "Ballerina@123"

# =============================================================================
# MI ARTIFACTS API CONFIGURATION
# =============================================================================
# NOTE: Must remain in the top-level section (before any [section] header).
# artifactsApiAllowInsecureTLS = true  # set false in production with proper trust

# =============================================================================
# AUTHENTICATION BACKEND CONFIGURATION
# =============================================================================
# Authentication backend service settings
# URL of the authentication backend service (can be custom implementation)
authBackendUrl = "https://localhost:9447"


# =============================================================================
# AUTH SERVICE CONFIGURATION
# =============================================================================
# Authorization service settings
frontendJwtHMACSecret = "default-secret-key-at-least-32-characters-long-for-hs256"

# =============================================================================
# CREDENTIALS DATABASE CONFIGURATION
# =============================================================================
# The default auth backend stores user credentials in a separate database/schema.
# Set credentialsDbType to the database type used for credential storage (independent of the main database).
# For PostgreSQL, credentials are stored in a "credentials" schema within the same database.
# For H2, credentials are stored in a separate file (./database/credentials).
# credentialsDbType = "h2"          # Options: h2, postgresql, mysql, mssql, oracle
# credentialsDbHost = "localhost"   # Not used for H2
# credentialsDbPort = 5432          # Not used for H2
# credentialsDbName = "credentials_db"
# credentialsDbUser = "icp_user"
# credentialsDbPassword = "icp_password"

# Token expiry settings
# defaultTokenExpiryTime = 3600  # 1 hour - JWT access token expiry
# refreshTokenExpiryTime = 604800  # 7 days - Refresh token expiry

# Refresh token security settings
# enableRefreshTokenRotation = true  # Rotate refresh token on each use (recommended for security)
# maxRefreshTokensPerUser = 10  # Maximum active refresh tokens per user (0 = unlimited)
#                                # Useful to limit the number of devices/sessions per user

# =============================================================================
# LDAP CONFIGURATION
# =============================================================================
# Uncomment and fill in the settings below to use an LDAP directory as the user store.
# Only ldapUserStoreEnabled needs to be changed for a basic setup; all other values
# have sensible defaults that can be tuned to match your directory schema.

# --- Activation ---
# ldapUserStoreEnabled = false        # Set to true to activate the LDAP user store

# --- LDAP server connection ---
# ldapHostName = "localhost"
# ldapPort = 10389                    # Use 636 for LDAPS
# ldapConnectionName = "uid=admin,ou=system"
# ldapConnectionPassword = "secret"

# --- User search ---
# ldapUserSearchBase = "ou=Users,dc=wso2,dc=org"
# ldapUserNameAttribute = "uid"       # Use "sAMAccountName" for Active Directory
# ldapUserSearchFilter = "(&(objectClass=person)(uid=?))"   # '?' is replaced with the username
# ldapUserDNPattern = ""              # Optional: construct DN directly, e.g. "uid={0},ou=Users,dc=wso2,dc=org"
# ldapDisplayNameAttribute = ""       # Attribute used as the display name in ICP; leave empty to use username

# --- Role / group lookup ---
# ldapReadGroups = true               # Set to false to skip group lookup entirely

# Active Directory memberOf strategy (takes precedence when set):
# ldapMemberOfAttribute = ""          # e.g. "memberOf"
# ldapGroupNameAttribute = "cn"       # Attribute that holds the group name (used with memberOf strategy)

# Standard LDAP group-search strategy (used when ldapMemberOfAttribute is empty):
# ldapGroupSearchBase = "ou=Groups,dc=wso2,dc=org"
# ldapGroupNameAttribute = "cn"
# ldapGroupSearchFilter = "(objectClass=groupOfNames)"
# ldapMembershipAttribute = "member"  # Use "uniqueMember" or "memberUid" for posixGroup schemas

# --- Admin role mapping ---
# Names of LDAP groups whose members are granted ICP super-admin on first login.
# Comparison is case-sensitive and uses the ldapGroupNameAttribute value.
# ldapAdminRoles = ["admin"]                 # e.g. ["icp-admins", "administrators"]

# --- TLS (LDAPS) ---
# ldapSslEnabled = false
# ldapTrustStorePath = ""             # Path to a JKS truststore for verifying the LDAP server's CA cert
# ldapTrustStorePassword = ""

# Secrets alias form (use with [icp_server.secrets] block below):
# ldapConnectionPassword = "$secret{ldapConnectionPassword}"
# ldapTrustStorePassword = "$secret{ldapTrustStorePassword}"

# =============================================================================
# SSO (OIDC) CONFIGURATION
# =============================================================================
# Single Sign-On using OpenID Connect (OIDC)
# Enable this to allow users to authenticate with an external identity provider
# This works alongside the pluggable authentication backend

# Enable or disable SSO authentication
# ssoEnabled = false

# Example configuration for Asgardeo (WSO2's Identity Provider)
# Replace {org_name} with your Asgardeo organization name
# ssoIssuer = "https://api.asgardeo.io/t/{org_name}/oauth2/token"
# ssoAuthorizationEndpoint = "https://api.asgardeo.io/t/{org_name}/oauth2/authorize"
# ssoTokenEndpoint = "https://api.asgardeo.io/t/{org_name}/oauth2/token"
# ssoLogoutEndpoint = "https://api.asgardeo.io/t/{org_name}/oidc/logout"
# ssoJwksUrl = "https://api.asgardeo.io/t/{org_name}/oauth2/jwks"
# ssoClientId = "your-client-id-from-asgardeo"
# ssoClientSecret = "your-client-secret-from-asgardeo"
# ssoRedirectUri = "https://localhost:9446/sso/callback"
# ssoUsernameClaim = "email"  # or "preferred_username"
# ssoScopes = ["openid", "email", "profile"]
# ssoAllowInsecureTLS = false  # For OIDC providers running with self-signed cert
# passwordLoginDisabled = false  # Set true to disable local username/password login
# ssoAdminClaim = "groups"  # Required when passwordLoginDisabled = true
# ssoAdminValues = ["icp-platform-admins"]  # Required when passwordLoginDisabled = true
# federatedAccessControlEnabled = false  # Set true to manage group membership from IdP claims (requires ssoEnabled = true and passwordLoginDisabled = true)

# Example configuration for Okta
# ssoIssuer = "https://{your-domain}.okta.com/oauth2/default"
# ssoAuthorizationEndpoint = "https://{your-domain}.okta.com/oauth2/default/v1/authorize"
# ssoTokenEndpoint = "https://{your-domain}.okta.com/oauth2/default/v1/token"
# ssoLogoutEndpoint = "https://{your-domain}.okta.com/oauth2/default/v1/logout"
# ssoJwksUrl = "https://{your-domain}.okta.com/oauth2/default/v1/keys"
# ssoClientId = "your-okta-client-id"
# ssoClientSecret = "your-okta-client-secret"
# ssoRedirectUri = "https://localhost:9446/sso/callback"
# ssoUsernameClaim = "email"
# ssoScopes = ["openid", "email", "profile"]
# ssoAllowInsecureTLS = false  # For OIDC providers running with self-signed cert

# Example configuration for Auth0
# ssoIssuer = "https://{your-domain}.auth0.com/"
# ssoAuthorizationEndpoint = "https://{your-domain}.auth0.com/authorize"
# ssoTokenEndpoint = "https://{your-domain}.auth0.com/oauth/token"
# ssoLogoutEndpoint = "https://{your-domain}.auth0.com/v2/logout"
# ssoJwksUrl = "https://{your-domain}.auth0.com/.well-known/jwks.json"
# ssoClientId = "your-auth0-client-id"
# ssoClientSecret = "your-auth0-client-secret"
# ssoRedirectUri = "https://localhost:9446/sso/callback"
# ssoUsernameClaim = "email"
# ssoScopes = ["openid", "email", "profile"]
# ssoAllowInsecureTLS = false  # For OIDC providers running with self-signed cert

# Notes:
# - The 'openid' scope is required for OIDC authentication
# - Use 'email' or 'profile' scopes to get additional user information
# - The usernameClaim must be either 'email' or 'preferred_username'
# - On first login, a new user will be created in the ICP database
# - The redirect URI must match what's configured in your identity provider

# =============================================================================
# SECRETS ALIAS CONFIGURATION
# =============================================================================
# frontendJwtHMACSecret = "$secret{secretJWTsecret}"
# credentialsDbPassword = "$secret{secCredsDbPassword}"

# =============================================================================
# ENCRYPTED SECRETS CONFIGURATION
# =============================================================================
[icp_server.secrets]
# secretJWTsecret = "encrypted-value-for-jwt-secret"
# secCredsDbPassword = "encrypted-value-for-credentials-db-password"
# ldapConnectionPassword = "encrypted-value-for-ldap-connection-password"
# ldapTrustStorePassword = "encrypted-value-for-ldap-truststore-password"

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
[icp_server.storage]
# heartbeatTimeoutSeconds = 30
# artifactsApiAllowInsecureTLS = true  # set false in production with proper trust
# Primary database connection settings
# Database type: h2 (in-memory), mysql, mssql, postgresql, or oracle. Default is h2

# MySQL Configuration
# dbHost = "mysql-db"
# dbPort = 3306
# dbName = "icp_database"
# dbUser = "root"
# dbPassword = "my-secret-pw"
# maxOpenConnections = 10
# minIdleConnections = 5
# maxConnectionLifeTime = 1800.0  # 30 minutes
# dbType = "mysql"

# PostgreSQL Configuration (commented out)
# dbHost = "localhost"
# dbPort = 5432
# dbName = "icp_database"
# dbUser = "postgres"
# dbPassword = "my-secret-pw"
# maxOpenConnections = 10
# minIdleConnections = 5
# maxConnectionLifeTime = 1800.0  # 30 minutes
# dbType = "postgresql"

# Microsoft SQL Server (MSSQL) Configuration
# dbHost = "localhost"
# dbPort = 1433
# dbName = "icp_database"
# dbUser = "sa"
# dbPassword = "YourStrong@Passw0rd"
# maxOpenConnections = 10
# minIdleConnections = 5
# maxConnectionLifeTime = 1800.0
# dbType = "mssql"

# Oracle Database Configuration (19c+)
# dbHost = "localhost"
# dbPort = 1521
# dbName = "ORCLPDB1"   # Oracle service name (PDB)
# dbUser = "icp_user"
# dbPassword = "my-secret-pw"
# dbUseTLS = false      # set true for TCPS endpoints, e.g. Oracle Autonomous Database
# maxOpenConnections = 10
# minIdleConnections = 5
# maxConnectionLifeTime = 1800.0
# dbType = "oracle"

# =============================================================================
# DATABASE SECRETS ALIAS CONFIGURATION
# =============================================================================
# dbPassword = "$secret{secDbPassword}"

# =============================================================================
# DATABASE ENCRYPTED SECRETS CONFIGURATION
# =============================================================================
[icp_server.storage.secrets]
# secDbPassword = "encrypted-value-for-db-password"


[[ballerina.log.modules]]
name = "wso2/icp_server"
level = "INFO"

[ballerina.http.traceLogAdvancedConfig]
# Enable printing trace logs on the Console. The default value is `false`.
console = false
