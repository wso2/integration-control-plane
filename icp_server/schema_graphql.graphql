# ============================================
# Fetchable - MI management answers
# ============================================
# Every field the MI management API serves carries these three. With `miTunnelEnabled`
# off — the default — the ICP dials the runtime's management port and answers inside the
# request, so `preparing` is never true and behaviour is what it always was. With it on,
# the question rides down on the runtime's next heartbeat and the first answer may be
# `preparing`.
#
# Read `preparing` before anything else: a field that reports it has no answer yet, so its
# other members hold defaults — and on a mutation `success` is false while nothing failed.
# `stale` means the value is real but superseded (by your own write, usually) and its
# replacement is on the way. `retryAfterMs` is when to ask again; zero means settled.

type FetchableText {
  preparing: Boolean!
  stale: Boolean!
  retryAfterMs: Int!
  content: String!
}

type FetchableParameters {
  preparing: Boolean!
  stale: Boolean!
  retryAfterMs: Int!
  parameters: [Parameter!]!
}

type FetchableDataService {
  preparing: Boolean!
  stale: Boolean!
  retryAfterMs: Int!
  dataService: MgmtDataServiceInfo
}

