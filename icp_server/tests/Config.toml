# Test Configuration for ICP Server
# This configuration is used when running tests

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
serverPort = 9446
serverHost = "0.0.0.0"
runtimeListenerPort = 9445

# =============================================================================
# OPERATIONAL CONFIGURATION
# =============================================================================
schedulerIntervalSeconds = 600

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logLevel = "DEBUG"
enableAuditLogging = true
enableMetrics = true

# =============================================================================
# AUTHENTICATION BACKEND CONFIGURATION
# =============================================================================
authBackendUrl = "https://localhost:9447"

# Local user store (credentials) DB — self-contained H2, see initTestH2 gradle task
credentialsDbType = "h2"
credentialsDbName = "credentials_test_db"
credentialsDbUser = "icp_user"
credentialsDbPassword = "icp_password"

# JWT Configuration
frontendJwtHMACSecret = "default-secret-key-at-least-32-characters-long-for-hs256"
frontendJwtIssuer = "icp-frontend-jwt-issuer"
frontendJwtAudience = "icp-server"
defaultTokenExpiryTime = 3600

# =============================================================================
# SSO (OIDC) CONFIGURATION FOR TESTING
# =============================================================================
# Mock OIDC provider for integration tests
ssoEnabled = true
ssoIssuer = "http://localhost:9458/oauth2/token"
ssoAuthorizationEndpoint = "http://localhost:9458/oauth2/authorize"
ssoTokenEndpoint = "http://localhost:9458/oauth2/token"
ssoLogoutEndpoint = "http://localhost:9458/oauth2/logout"
ssoJwksUrl = "http://localhost:9458/oauth2/jwks"
ssoClientId = "test-client-id"
ssoClientSecret = "test-client-secret"
ssoRedirectUri = "http://localhost:3000/sso/callback"
ssoUsernameClaim = "email"
ssoScopes = ["openid", "email", "profile"]
ssoAdminClaim = "groups"
ssoAdminValues = ["icp-platform-admins"]

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
# Self-contained H2 — no external DB. The `initTestH2` gradle task recreates the
# icp_test_db / credentials_test_db files (schema + seed data) before `bal test`.
[icp_server.storage]
dbType = "h2"
dbName = "icp_test_db"
dbUser = "icp_user"
dbPassword = "icp_password"
heartbeatTimeoutSeconds = 30
# Holds only the internal CA that signed the mock management API's certificate (mi_management_tls_tests.bal)
artifactsApiTrustStorePath = "tests/resources/keys/mi_internal_ca_truststore.p12"
artifactsApiTrustStorePassword = "changeit"

[[ballerina.log.modules]]
name = "wso2/icp_server"
level = "DEBUG"

